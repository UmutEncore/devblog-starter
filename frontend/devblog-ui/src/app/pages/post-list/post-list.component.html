<h1 class="mb-4">Posts</h1>
<div class="list-group">
  @for (post of posts; track post.id) {
    <a class="list-group-item list-group-item-action" [routerLink]="['/posts', post.slug]">
      <div class="d-flex justify-content-between align-items-start">
        <h5 class="mb-1">{{ post.title }}</h5>
        <small class="text-muted">{{ post.publishedAt | date:'mediumDate' }}</small>
      </div>
      <p class="mb-1 text-muted">{{ post.author }}</p>
      <span class="badge text-bg-secondary">{{ post.tags }}</span>
      <small class="text-muted d-block mt-1">{{ post.commentCount }} comments</small>
    </a>
  }
</div>
