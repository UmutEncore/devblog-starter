<h1>Posts</h1>
<ul>
  @for (post of posts; track post.id) {
    <li>
      <a [routerLink]="['/posts', post.slug]">{{ post.title }}</a>
      <small> — {{ post.author }} | {{ post.publishedAt | date:'mediumDate' }}</small>
      <br>
      <em>{{ post.tags }}</em>
      <br>
      <small>{{ post.commentCount }} comments</small>
    </li>
  }
</ul>
